# logit_kd run config — Phase 5. Same-tokenizer teacher with cached top-k.
mode: logit_kd
model: student_base
lora: configs/lora.yaml
seed: 7
kd:
  alpha: 0.5
  temperature: 2.0
  divergence: forward
  topk: 32
data:
  teacher_cache: data/teacher_cache/<teacher_id>/<revision>/
  replay_ratio: 0.2
  persona_ratio: 0.2
eval:
  heldout_general: data/processed/heldout_general.jsonl
  track_drift: true
  eval_every_steps: 100
train:
  max_steps: 1000
  checkpoint_every_steps: 200
  max_seq_len: 2048
output_dir: runs/logit_kd_v1
resume_from: null
